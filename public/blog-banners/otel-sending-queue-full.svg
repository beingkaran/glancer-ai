<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An OpenTelemetry Collector pipeline where the exporter queue is full and incoming spans are rejected while the backend returns errors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131c28"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#1f2937" stroke-width="1" opacity="0.5">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
  </g>

  <text x="70" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#f0883e" letter-spacing="2.5">ERROR / EXPORTERHELPER</text>
  <text x="70" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e6edf3">sending queue is full</text>
  <text x="70" y="177" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#8b949e">The buffer is not the problem. Whatever sits after it is.</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="70" y="330" width="140" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="140" y="368" text-anchor="middle" font-size="17" fill="#e6edf3">Receiver</text>
    <text x="140" y="392" text-anchor="middle" font-size="13" fill="#6e7681">OTLP :4317</text>
    <line x1="216" y1="373" x2="252" y2="373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="258" y="330" width="150" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="333" y="368" text-anchor="middle" font-size="17" fill="#e6edf3">Processors</text>
    <text x="333" y="392" text-anchor="middle" font-size="13" fill="#6e7681">memory_limiter</text>
    <line x1="414" y1="373" x2="450" y2="373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="456" y="318" width="404" height="110" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="472" y="344" font-size="13" fill="#f0883e" font-family="ui-monospace, Menlo, monospace" letter-spacing="1.5">SENDING QUEUE / AT CAPACITY</text>
    <g fill="url(#hot)">
      <rect x="472" y="356" width="32" height="52" rx="4"/>
      <rect x="510" y="356" width="32" height="52" rx="4"/>
      <rect x="548" y="356" width="32" height="52" rx="4"/>
      <rect x="586" y="356" width="32" height="52" rx="4"/>
      <rect x="624" y="356" width="32" height="52" rx="4"/>
      <rect x="662" y="356" width="32" height="52" rx="4"/>
      <rect x="700" y="356" width="32" height="52" rx="4"/>
      <rect x="738" y="356" width="32" height="52" rx="4"/>
      <rect x="776" y="356" width="32" height="52" rx="4"/>
      <rect x="814" y="356" width="32" height="52" rx="4"/>
    </g>
    <line x1="866" y1="373" x2="902" y2="373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="908" y="330" width="130" height="86" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="973" y="368" text-anchor="middle" font-size="17" fill="#e6edf3">Consumers</text>
    <text x="973" y="392" text-anchor="middle" font-size="13" fill="#6e7681">retrying</text>
    <line x1="1044" y1="373" x2="1074" y2="373" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1080" y="330" width="50" height="86" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="1105" y="380" text-anchor="middle" font-size="24" fill="#f85149">503</text>
    <text x="1105" y="444" text-anchor="middle" font-size="13" fill="#8b949e">backend</text>

    <path d="M600 316 C 600 262, 700 250, 762 244" fill="none" stroke="#f85149" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
    <g fill="#f85149" opacity="0.85">
      <rect x="782" y="228" width="24" height="24" rx="4"/>
      <rect x="816" y="238" width="18" height="18" rx="4" opacity="0.7"/>
      <rect x="844" y="248" width="12" height="12" rx="3" opacity="0.5"/>
    </g>
    <text x="782" y="212" font-size="16" fill="#f85149" font-weight="600">rejected_items: 4096</text>

    <text x="70" y="530" font-size="16" fill="#6e7681" font-family="ui-monospace, Menlo, monospace">otelcol_exporter_queue_size  ==  otelcol_exporter_queue_capacity</text>
    <text x="70" y="558" font-size="16" fill="#6e7681" font-family="ui-monospace, Menlo, monospace">otelcol_exporter_enqueue_failed_spans  climbing</text>
    <text x="1130" y="570" text-anchor="end" font-size="15" fill="#484f58">glancerai.com</text>
  </g>
</svg>
